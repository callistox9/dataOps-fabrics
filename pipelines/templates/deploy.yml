parameters:
  - name: environment          # key used in parameter.yml (TEST, PROD)
    type: string
  - name: adoEnvironment       # Azure DevOps Environment (holds approvals)
    type: string
  - name: serviceConnection    # ARM service connection (workload identity federation preferred)
    type: string
  - name: unpublishOrphans     # delete workspace items that are not in the repo
    type: boolean
    default: false

jobs:
  - deployment: deploy_${{ lower(parameters.environment) }}
    displayName: Deploy ${{ parameters.environment }}
    environment: ${{ parameters.adoEnvironment }}
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
            - task: UsePythonVersion@0
              inputs:
                versionSpec: '3.12'
            - script: pip install -r requirements.txt
              displayName: Install dependencies
            - task: AzureCLI@2
              displayName: Publish items to ${{ parameters.environment }}
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  python scripts/deploy.py \
                    --workspace-id "$(WORKSPACE_ID)" \
                    --environment "${{ parameters.environment }}" \
                    --repo-dir workspace ${{ iif(parameters.unpublishOrphans, '--unpublish-orphans', '') }}