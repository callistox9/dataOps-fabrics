trigger:
  branches:
    include: [dev, test, prod]
  paths:
    include: [workspace/*, scripts/*, pipelines/*, requirements.txt]

pr:
  branches:
    include: [dev]

pool:
  vmImage: ubuntu-latest

stages:
  # Static checks run once, on PRs into dev and on pushes to dev.
  - stage: Validate
    condition: or(eq(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    jobs:
      - job: validate
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
          - script: pip install -r requirements.txt ruff yamllint
            displayName: Install dependencies
          - script: ruff check scripts
            displayName: Lint Python
          - script: yamllint azure-pipelines.yml pipelines workspace/parameter.yml
            displayName: Lint YAML
          - script: python scripts/validate.py
            displayName: Repo policy checks

  - stage: Deploy_Test
    dependsOn: []
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/test')
    variables:
      - group: fabric-test
    jobs:
      - template: pipelines/templates/deploy.yml
        parameters:
          environment: TEST
          adoEnvironment: fabric-test
          serviceConnection: sc-fabric-test
          provenance: ancestor-of-dev
          tagPrefix: tested

  - stage: Deploy_Prod
    dependsOn: []
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/prod')
    variables:
      - group: fabric-prod
    jobs:
      - template: pipelines/templates/deploy.yml
        parameters:
          environment: PROD
          adoEnvironment: fabric-prod      # approvals live here
          serviceConnection: sc-fabric-prod
          provenance: tested-tag
          tagPrefix: released