trigger:
  branches:
    include: [dev, test, prod]
  paths:
    include: [workspace/*, scripts/*, pipelines/*, requirements.txt] ## All scripts loaded into pipeline

pr:
  branches:
    include: [dev]   ## We will only be commiting in dev branch. PRs will be raised from dev to test and dev to prod.

pool:
  vmImage: ubuntu-latest

stages:
                                       # Static checks on PRs into dev and on pushes to dev.
  - stage: Validate
    condition: or(eq(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    jobs:
      - job: validate
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
          - script: pip install -r requirements.txt ruff yamllint
            displayName: Install dependencies
          - script: ruff check scripts
            displayName: Lint Python
          - script: yamllint azure-pipelines.yml pipelines workspace/parameter.yml
            displayName: Lint YAML
          - script: python scripts/validate.py
            displayName: Repo policy checks

  - stage: Deploy_Test
    dependsOn: []
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/test')
    variables:
      - group: fabric-test
    jobs:
      - template: pipelines/templates/deploy.yml
        parameters:
          environment: TEST
          adoEnvironment: fabric-test
          serviceConnection: sc-fabric-test
          provenance: ancestor-of-dev
          tagPrefix: tested
                          
                           ## Not always necessary. Comment out if dont want to push to prod
  - stage: Deploy_Prod     ### This is the stage that deploys to prod. It will only run if the source branch is prod. And the tests are successful.
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/prod')
    variables:
      - group: fabric-prod
    jobs:
      - template: pipelines/templates/deploy.yml
        parameters:
          environment: PROD
          adoEnvironment: fabric-prod      
          serviceConnection: sc-fabric-prod
          provenance: tested-tag
          tagPrefix: released